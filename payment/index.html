<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Pagamento · HS LOG Analyzer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5f6;color:#20262c;font-family:Arial,sans-serif}.card{width:min(520px,100%);padding:30px;border:1px solid #e0e4e7;border-radius:18px;background:#fff;box-shadow:0 22px 70px rgba(25,39,52,.13)}.brand{padding-bottom:15px;border-bottom:3px solid #f26a00;color:#e55f08;font-weight:800}h1{margin:22px 0 8px;font-size:24px}p{margin:0;color:#68747d;font-size:14px;line-height:1.65}.notice{margin-top:18px;border-radius:10px;background:#fff6ed;padding:12px;color:#8c4b1d;font-weight:700}.notice.ok{background:#edf9f2;color:#286c45}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">HS LOG Analyzer</div>
    <h1 id="title">Retorno do pagamento</h1>
    <p id="description">Aguarde enquanto conferimos o retorno.</p>
    <p id="notice" class="notice">Volte ao aplicativo para consultar sua licença.</p>
  </main>
  <script>
    const state=new URLSearchParams(location.search).get('state');
    const title=document.getElementById('title');
    const description=document.getElementById('description');
    const notice=document.getElementById('notice');
    if(state==='success'){
      title.textContent='Pagamento enviado para processamento';
      description.textContent='A confirmação financeira será recebida automaticamente pelo sistema.';
      notice.textContent='Volte ao HS LOG Analyzer e clique em “Verificar liberação”.';
      notice.className='notice ok';
    }else{
      title.textContent='Pagamento não concluído';
      description.textContent='O pagamento não foi confirmado nesta etapa.';
      notice.textContent='Volte ao aplicativo para tentar novamente ou consultar a situação da assinatura.';
    }
  </script>
</body>
</html>
