<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>E-mail confirmado · HS LOG Analyzer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5f6;color:#20262c;font-family:Arial,sans-serif}.card{width:min(480px,100%);padding:30px;border:1px solid #e0e4e7;border-radius:18px;background:#fff;box-shadow:0 22px 70px rgba(25,39,52,.13)}.brand{padding-bottom:15px;border-bottom:3px solid #f26a00;color:#e55f08;font-weight:800}h1{margin:22px 0 8px;font-size:24px}p{margin:0;color:#68747d;font-size:14px;line-height:1.65}.ok{margin-top:18px;border-radius:10px;background:#edf9f2;padding:12px;color:#286c45;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">HS LOG Analyzer</div>
    <h1>E-mail confirmado</h1>
    <p>Seu endereço foi validado com segurança.</p>
    <p class="ok">Você já pode fechar esta página, voltar ao aplicativo e entrar com sua senha.</p>
  </main>
  <script>if(location.hash)history.replaceState(null,'',location.pathname);</script>
</body>
</html>
