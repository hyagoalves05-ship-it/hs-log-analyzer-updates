<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>HS LOG Analyzer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f8f9fa,#eef1f3);color:#20262c;font-family:Arial,sans-serif}.card{width:min(520px,100%);padding:32px;border:1px solid #e0e4e7;border-radius:20px;background:#fff;box-shadow:0 22px 70px rgba(25,39,52,.13)}.brand{padding-bottom:16px;border-bottom:3px solid #f26a00;color:#e55f08;font-size:20px;font-weight:800}h1{margin:24px 0 10px;font-size:25px}p{margin:0;color:#68747d;font-size:14px;line-height:1.7}.status{margin-top:20px;border-radius:11px;background:#edf9f2;padding:13px;color:#286c45;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">HS LOG Analyzer</div>
    <h1>Serviços do aplicativo</h1>
    <p>Canal oficial para atualizações, confirmação de contas, recuperação de senha e retorno de pagamentos do HS LOG Analyzer.</p>
    <p class="status">Serviço disponível.</p>
  </main>
</body>
</html>
